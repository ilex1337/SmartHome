<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-label="Illustration eines modernen Smart Homes mit Pool, Solaranlage, Beleuchtung und Garten">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091d32"/><stop offset=".55" stop-color="#234661"/><stop offset="1" stop-color="#728995"/></linearGradient>
  <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5edf1"/><stop offset=".55" stop-color="#aebec7"/><stop offset="1" stop-color="#697f8d"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112d49"/><stop offset=".5" stop-color="#356c85"/><stop offset="1" stop-color="#0e233d"/></linearGradient>
  <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70e0ec"/><stop offset=".45" stop-color="#1d93b8"/><stop offset="1" stop-color="#0b537d"/></linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#325e5e"/><stop offset="1" stop-color="#122a37"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fce4a5" stop-opacity=".75"/><stop offset="1" stop-color="#fce4a5" stop-opacity="0"/></radialGradient>
  <pattern id="lines" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
  <pattern id="poolLine" width="105" height="34" patternUnits="userSpaceOnUse"><path d="M0 16 Q27 6 53 16 T105 16" fill="none" stroke="#a9f4fb" stroke-width="2" stroke-opacity=".33"/></pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="23"/></filter>
  <filter id="lights"><feGaussianBlur stdDeviation="12"/></filter>
 </defs>
 <rect width="1600" height="980" fill="url(#sky)"/>
 <circle cx="1250" cy="180" r="260" fill="#68bac3" opacity=".10"/>
 <circle cx="110" cy="150" r="250" fill="#2a91b6" opacity=".10"/>
