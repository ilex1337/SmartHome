 <g stroke="#6fe0f8" stroke-opacity=".65" fill="none" stroke-width="3" stroke-linecap="round"><path d="M130 824q27-58 70-30M130 824q-9-56-39-38"/><circle cx="130" cy="826" r="5" fill="#a0e7f2"/></g>
 <!-- camera -->
 <g transform="translate(234 476)"><rect x="-7" y="-12" width="55" height="23" rx="6" fill="#e3f2f5" stroke="#244053" stroke-width="5"/><circle cx="37" cy="0" r="8" fill="#244158"/><path d="M8 12V28" stroke="#e1eef2" stroke-width="6"/></g>
